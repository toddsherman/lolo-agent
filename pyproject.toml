[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lolo-agent"
version = "0.1.0"
description = "Pixel-only, save-state-branching research agent for Adventures of Lolo"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
ml = ["torch>=2.13", "torchvision>=0.28"]

[project.scripts]
lolo-agent = "lolo_agent.cli:main"
lolo-emulator-smoke = "lolo_agent.emulator_smoke:main"
lolo-train-smoke = "lolo_agent.train_smoke:main"
lolo-ensemble-smoke = "lolo_agent.ensemble_smoke:main"
lolo-neural-run = "lolo_agent.neural_run:main"
lolo-log = "lolo_agent.log_summary:main"
lolo-replay = "lolo_agent.replay:main"
lolo-experiment = "lolo_agent.experiment:main"
lolo-import-experience = "lolo_agent.experience_import:main"
lolo-reward-audit = "lolo_agent.reward_audit:main"
lolo-spatial-train = "lolo_agent.spatial_train:main"

[tool.setuptools.packages.find]
include = ["lolo_agent*"]
